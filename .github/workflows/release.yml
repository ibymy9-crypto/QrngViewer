name: 'Release'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.release_id }}

    steps:
      - uses: actions/checkout@v4
      
      - name: Install system dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install npm dependencies
        run: npm install
      
      - name: Generate app icons
        run: |
          npx @tauri-apps/cli icon app-icon.png -o src-tauri/icons
          ls -la src-tauri/icons/
          file src-tauri/icons/512x512.png
      
      - name: create release
        id: create-release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ steps.create-release.outputs.release_id }}

  build-tauri:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: install dependencies
        run: npm install

      - name: Generate app icons (all platforms)
        run: |
          npx @tauri-apps/cli icon app-icon.png -o src-tauri/icons
          echo "=== Generated icons ==="
          ls -la src-tauri/icons/
          
          # 确保 512x512.png 存在且有效
          if [ ! -f src-tauri/icons/512x512.png ]; then
            echo "ERROR: 512x512.png not found!"
            exit 1
          fi
          
          # 验证 PNG 格式
          file src-tauri/icons/512x512.png
          
          # 如果图标无效，使用 ImageMagick 创建备用图标
          if ! file src-tauri/icons/512x512.png | grep -q "PNG image"; then
            echo "Invalid PNG, creating fallback icon..."
            sudo apt-get install -y imagemagick
            convert -size 512x512 xc:#4A90E2 src-tauri/icons/512x512.png
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
