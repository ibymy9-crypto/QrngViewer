name: 'Release'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.release_id }}

    steps:
      - uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev \
            imagemagick
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install npm dependencies
        run: npm install
      
      - name: Clean and generate new icons
        run: |
          # 删除可能损坏的图标
          rm -rf src-tauri/icons
          mkdir -p src-tauri/icons
          
          # 使用 ImageMagick 生成 PNG 图标
          convert -size 512x512 xc:none -fill "#4A90E2" -draw "rectangle 0,0 512,512" \
            -fill white -gravity center -pointsize 200 -annotate +0+0 "Q" \
            src-tauri/icons/512x512.png
          
          convert src-tauri/icons/512x512.png -resize 32x32 src-tauri/icons/32x32.png
          convert src-tauri/icons/512x512.png -resize 128x128 src-tauri/icons/128x128.png
          convert src-tauri/icons/512x512.png -resize 256x256 src-tauri/icons/256x256.png
          
          # 验证图标
          echo "=== Generated Icons ==="
          file src-tauri/icons/*.png
          ls -la src-tauri/icons/
      
      - name: create release
        id: create-release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ steps.create-release.outputs.release_id }}

  build-tauri:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'windows-latest'
            args: ''
          # 暂时禁用 Linux
          # - platform: 'ubuntu-22.04'
          #   args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install npm dependencies
        run: npm install

      - name: Generate icons (macOS/Windows)
        run: |
          rm -rf src-tauri/icons
          mkdir -p src-tauri/icons
          
          # 使用 ImageMagick 生成 PNG 图标
          convert -size 512x512 xc:none -fill "#4A90E2" -draw "rectangle 0,0 512,512" \
            -fill white -gravity center -pointsize 200 -annotate +0+0 "Q" \
            src-tauri/icons/512x512.png
          
          convert src-tauri/icons/512x512.png -resize 32x32 src-tauri/icons/32x32.png
          convert src-tauri/icons/512x512.png -resize 128x128 src-tauri/icons/128x128.png
          
          ls -la src-tauri/icons/

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
