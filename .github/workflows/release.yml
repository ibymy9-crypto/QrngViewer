name: 'Release'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.release_id }}

    steps:
      - uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install npm dependencies
        run: npm install
      
      - name: Generate RGBA icons using Tauri CLI
        run: |
          # 创建临时 SVG 图标（Tauri 推荐方式）
          cat > logo.svg << 'SVGEOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <rect width="512" height="512" rx="100" fill="#4A90E2"/>
            <text x="256" y="320" font-size="200" text-anchor="middle" fill="white" font-family="Arial, sans-serif">Q</text>
          </svg>
          SVGEOF
          
          # 使用 Tauri CLI 生成图标（确保 RGBA 格式）
          npx @tauri-apps/cli icon logo.svg -o src-tauri/icons
          
          # 验证图标
          file src-tauri/icons/32x32.png
          ls -la src-tauri/icons/
      
      - name: create release
        id: create-release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ steps.create-release.outputs.release_id }}

  build-tauri:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install npm dependencies
        run: npm install

      - name: Generate RGBA icons using Tauri CLI
        run: |
          # 创建 SVG 图标
          cat > logo.svg << 'SVGEOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <rect width="512" height="512" rx="100" fill="#4A90E2"/>
            <text x="256" y="320" font-size="200" text-anchor="middle" fill="white" font-family="Arial, sans-serif">Q</text>
          </svg>
          SVGEOF
          
          # 生成图标
          npx @tauri-apps/cli icon logo.svg -o src-tauri/icons
          
          # 验证图标格式
          echo "=== Icons generated ==="
          ls -la src-tauri/icons/
          file src-tauri/icons/32x32.png

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
