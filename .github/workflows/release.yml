name: 'Release'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.release_id }}

    steps:
      - uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev \
            librsvg2-dev
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install npm dependencies
        run: npm install
      
      - name: Clean old icons and generate new ones
        run: |
          # 删除可能损坏的图标
          rm -rf src-tauri/icons
          mkdir -p src-tauri/icons
          
          # 创建 SVG 图标
          cat > logo.svg << 'SVGEOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <rect width="512" height="512" rx="100" fill="#4A90E2"/>
            <text x="256" y="320" font-size="200" text-anchor="middle" fill="white" font-family="Arial, sans-serif">Q</text>
          </svg>
          SVGEOF
          
          # 使用 rsvg-convert 生成 PNG（更可靠）
          rsvg-convert -w 512 -h 512 logo.svg > src-tauri/icons/512x512.png
          rsvg-convert -w 32 -h 32 logo.svg > src-tauri/icons/32x32.png
          rsvg-convert -w 128 -h 128 logo.svg > src-tauri/icons/128x128.png
          rsvg-convert -w 256 -h 256 logo.svg > src-tauri/icons/256x256.png
          
          # 验证 PNG 文件
          echo "=== Generated Icons ==="
          file src-tauri/icons/*.png
          ls -la src-tauri/icons/
      
      - name: create release
        id: create-release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ steps.create-release.outputs.release_id }}

  build-tauri:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'windows-latest'
            args: ''
          # - platform: 'ubuntu-22.04'
          #   args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install npm dependencies
        run: npm install

      - name: Clean and regenerate icons for all platforms
        run: |
          rm -rf src-tauri/icons
          mkdir -p src-tauri/icons
          
          # 创建 SVG 图标
          cat > logo.svg << 'SVGEOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <rect width="512" height="512" rx="100" fill="#4A90E2"/>
            <text x="256" y="320" font-size="200" text-anchor="middle" fill="white" font-family="Arial, sans-serif">Q</text>
          </svg>
          SVGEOF
          
          # 生成 PNG 图标
          if command -v rsvg-convert &> /dev/null; then
            rsvg-convert -w 512 -h 512 logo.svg > src-tauri/icons/512x512.png
            rsvg-convert -w 32 -h 32 logo.svg > src-tauri/icons/32x32.png
            rsvg-convert -w 128 -h 128 logo.svg > src-tauri/icons/128x128.png
          else
            # macOS 使用 sips
            sips -z 512 512 logo.svg --out src-tauri/icons/512x512.png 2>/dev/null || echo "Using fallback"
          fi
          
          ls -la src-tauri/icons/

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
