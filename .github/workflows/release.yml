name: 'Release'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.release_id }}

    steps:
      - uses: actions/checkout@v4
      
      - name: Install system dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev \
            imagemagick
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install npm dependencies
        run: npm install
      
      - name: Generate valid square icon
        run: |
          # 强制生成一个有效的方形 PNG 图标
          mkdir -p src-tauri/icons
          convert -size 512x512 xc:#4A90E2 -font Ubuntu -pointsize 80 -gravity center -annotate +0+0 "QRng" src-tauri/icons/512x512.png
          convert src-tauri/icons/512x512.png -resize 32x32 src-tauri/icons/32x32.png
          convert src-tauri/icons/512x512.png -resize 128x128 src-tauri/icons/128x128.png
          convert src-tauri/icons/512x512.png -resize 256x256 src-tauri/icons/256x256.png
          file src-tauri/icons/512x512.png
          ls -la src-tauri/icons/
      
      - name: create release
        id: create-release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ steps.create-release.outputs.release_id }}

  build-tauri:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev \
            imagemagick

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: install dependencies
        run: npm install

      - name: Force create valid square icon for AppImage
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # 确保图标目录存在
          mkdir -p src-tauri/icons
          
          # 使用 ImageMagick 生成有效图标
          convert -size 512x512 xc:#4A90E2 -font DejaVu-Sans -pointsize 100 -gravity center -annotate +0+0 "QRng" src-tauri/icons/512x512.png
          convert src-tauri/icons/512x512.png -resize 32x32 src-tauri/icons/32x32.png
          convert src-tauri/icons/512x512.png -resize 64x64 src-tauri/icons/64x64.png
          convert src-tauri/icons/512x512.png -resize 128x128 src-tauri/icons/128x128.png
          convert src-tauri/icons/512x512.png -resize 256x256 src-tauri/icons/256x256.png
          
          # 验证图标
          echo "=== Icons generated ==="
          ls -la src-tauri/icons/*.png
          file src-tauri/icons/512x512.png

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
