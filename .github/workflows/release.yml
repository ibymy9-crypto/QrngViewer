name: 'Release'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.release_id }}

    steps:
      - uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev \
            imagemagick
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install npm dependencies
        run: npm install
      
      - name: Generate RGBA icons
        run: |
          mkdir -p src-tauri/icons
          # 使用 ImageMagick 生成符合 RGBA 规范的图标
          convert -size 512x512 xc:none -fill "#4A90E2" -draw "rectangle 0,0 512,512" PNG32:src-tauri/icons/512x512.png
          convert src-tauri/icons/512x512.png -resize 32x32 PNG32:src-tauri/icons/32x32.png
          convert src-tauri/icons/512x512.png -resize 128x128 PNG32:src-tauri/icons/128x128.png
          convert src-tauri/icons/512x512.png -resize 256x256 PNG32:src-tauri/icons/256x256.png
          echo "=== Icons generated ==="
          file src-tauri/icons/32x32.png
      
      - name: create release
        id: create-release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ steps.create-release.outputs.release_id }}

  build-tauri:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install npm dependencies
        run: npm install

      - name: Generate RGBA icons (macOS/Windows)
        run: |
          mkdir -p src-tauri/icons
          # macOS 使用 sips，Windows 使用 ImageMagick
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            # 创建临时 SVG 并转换
            cat > icon.svg << 'SVGEOF'
            <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
              <rect width="512" height="512" rx="100" fill="#4A90E2"/>
              <text x="256" y="320" font-size="200" text-anchor="middle" fill="white" font-family="Helvetica">Q</text>
            </svg>
            SVGEOF
            qlmanage -t -s 512 -o . icon.svg
            mv icon.svg.png src-tauri/icons/512x512.png 2>/dev/null || convert icon.svg src-tauri/icons/512x512.png
          else
            # Windows/Linux 使用 ImageMagick
            convert -size 512x512 xc:none -fill "#4A90E2" -draw "rectangle 0,0 512,512" PNG32:src-tauri/icons/512x512.png
          fi
          
          convert src-tauri/icons/512x512.png -resize 32x32 PNG32:src-tauri/icons/32x32.png
          convert src-tauri/icons/512x512.png -resize 128x128 PNG32:src-tauri/icons/128x128.png
          
          echo "=== Icons on ${{ runner.os }} ==="
          file src-tauri/icons/32x32.png

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
