name: 'Release'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macOS
            bundle: dmg
            path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows
            bundle: msi
            path: target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: Linux
            bundle: deb
            path: target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb

    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev \
            libgtk-3-dev
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      
      - name: Install dependencies
        run: npm install
      
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'QRng Viewer ${{ github.ref_name }}'
          releaseBody: |
            ## QRng Viewer ${{ github.ref_name }}
            
            ### 支持平台
            - macOS Apple Silicon (.dmg)
            - Windows 64-bit (.msi)
            - Linux Ubuntu/Debian (.deb)
            
            ### 安装说明
            - **macOS**: 下载 .dmg 文件，拖入 Applications 文件夹
            - **Windows**: 运行 .msi 安装程序
            - **Linux**: sudo dpkg -i *.deb
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QrngViewer-${{ matrix.name }}
          path: ${{ matrix.path }}
          if-no-files-found: warn
